<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NIE LAB Publications</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;700&family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html{scrollbar-width:none}
</style>
<script>
// Sites 삽입 상자는 폭에 비례해 높이가 바뀐다 → 안쪽도 1068px 기준으로 같은 비율로 확대·축소해 스크롤이 하나만 생기게 한다
if(window!==top){
  // 사이트 삽입 상자는 폭에 비례해 높이가 바뀌고, 처음엔 좁게 떴다가 넓어지기도 한다 → 폭이 바뀔 때마다 다시 맞춘다
  // 넓은 화면(≥700): 1068px 기준으로 확대·축소하고 휴대폰용 @media 규칙을 끈다 / 휴대폰: 원래 크기 + 휴대폰 배치(.compact)
  const R=[];let mode=null;
  const ap=()=>{const w=innerWidth>=700,d=document.documentElement;
    d.style.zoom=w?innerWidth/1068:1;d.classList.toggle('compact',!w);
    if(w===mode)return;mode=w;
    if(w)[...document.styleSheets].forEach(s=>{try{for(let i=s.cssRules.length-1;i>=0;i--)if(s.cssRules[i] instanceof CSSMediaRule){R.push([s,s.cssRules[i].cssText]);s.deleteRule(i)}}catch(e){}});
    else R.splice(0).forEach(([s,t])=>{try{s.insertRule(t,s.cssRules.length)}catch(e){}});};
  ap();addEventListener("resize",ap);addEventListener("DOMContentLoaded",()=>{mode=null;ap()});
}
</script>
<style>html::-webkit-scrollbar{display:none}
.pt{text-align:center;margin:6px 0 30px}.pt h1{font-family:Oswald,sans-serif;font-weight:400;font-size:58px;line-height:1.15;color:#212121;display:inline-block;padding:0 48px 4px;border-bottom:8px solid #ff5252}
@media(max-width:700px){.pt h1{font-size:38px;padding:0 20px 2px;border-bottom-width:6px}}
.ld{display:flex;align-items:center;justify-content:center;gap:14px;padding:70px 0;font-family:Oswald,sans-serif;font-size:24px;letter-spacing:1px;color:#616161}
.sp{width:28px;height:28px;border:3px solid #e0e0e0;border-top-color:#0000ff;border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
body{background:#fff;font-family:"Open Sans",Arial,sans-serif;color:#212121}
a{color:#0000ff}
.wrap{max-width:1160px;margin:0 auto;padding:4px 8px 32px}
.top{display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:12px;margin:8px 0 28px}
.total{font-family:Oswald;font-size:22px;text-transform:uppercase;letter-spacing:.5px}
.total b{color:#0000ff;font-size:44px;font-weight:700;margin-right:6px}
.links{font-size:13px;color:#616161;line-height:1.7;text-align:right}
.legend{font-size:13px;color:#616161}
nav{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 30px}
nav a{font-family:Oswald;font-size:15px;text-decoration:none;color:#1f1f1f;border:1px solid #e0e0e0;border-radius:4px;padding:3px 12px}
nav a:hover{border-color:#0000ff;color:#0000ff}
h2{font-family:Oswald;font-weight:400;font-size:34px;text-transform:uppercase;margin:44px 0 6px}
h2 b{color:inherit;font-weight:inherit}
h2 small{font-family:"Open Sans";font-size:14px;color:#9e9e9e;margin-left:10px;text-transform:none}
.rule{width:56px;height:4px;background:#ff5252;margin:0 0 22px}
.p{display:flex;gap:26px;padding:18px 0;border-bottom:1px solid #eee;align-items:flex-start}
.n{font-family:Oswald;font-size:20px;color:#bdbdbd;min-width:34px;padding-top:2px}
.img{flex:none;width:260px}
.img img{width:100%;height:auto;border:1px solid #eee;border-radius:3px;background:#fafafa}
.txt{font-size:13.5px;line-height:1.6}
.au .me{font-weight:700;text-decoration:underline}
.ti{font-weight:700;font-size:15px;margin:3px 0}
.jo i{font-style:italic}
.doi{font-size:12.5px}
.old .p{padding:10px 0}
@media(max-width:700px){.p{flex-direction:column;gap:10px}.img{width:100%;max-width:420px}.links{text-align:left}}
</style>
</head>
<body>
<div class="wrap"><div class="pt"><h1>PUBLICATIONS</h1></div>
  <div class="top">
    <div class="total" id="total"></div>
    <div class="links">
      <a href="https://scholar.google.com/citations?user=_ME8VaYAAAAJ" target="_blank" rel="noopener">Google Scholar</a> ·
      <a href="https://orcid.org/0000-0001-5727-5716" target="_blank" rel="noopener">ORCID</a> ·
      <a href="https://www.researchgate.net/profile/Eun-Lee-52/publications" target="_blank" rel="noopener">ResearchGate</a><br>
      <span class="legend" id="upd"></span><br>
      <span class="legend">* Corresponding author &nbsp; † Co-first author</span>
    </div>
  </div>
  <nav id="nav"></nav>
  <div id="list"><div class="ld" id="ld"><span class="sp"></span>Loading…</div></div>
</div>
<script>
// Publications: Apps Script 웹앱(시트 「NIE LAB Publications」, 매일 OpenAlex·ORCID 확인)이 내주는 JSON을 그린다
const API='https://script.google.com/macros/s/AKfycbwQ1zLyqlhWx-5i-VVdNoP1oInUUhwnRqPiLEOHH3Gw50bw8Gat0yg9bvZ90tz4OpHWyw/exec?type=pubs';
const SPLIT=2022;
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const me=a=>esc(a).replace(/(E\. ?K\. ?Lee[*†,]*)/g,'<span class="me">$1</span>');
function cite(p){
  const vp=[p.v,p.p].filter(Boolean).join(', ');
  return `<span class="jo"><i>${esc(p.j)}</i>${vp?' '+esc(vp):''} (${p.y})</span>`;
}
function item(p,n,withImg){
  return `<div class="p"><div class="n">${n}</div>${withImg&&p.img?`<div class="img"><img src="${p.img}" alt="" loading="lazy"></div>`:''}
  <div class="txt"><div class="au">${me(p.a)}</div><div class="ti">${esc(p.t)}</div>${cite(p)}
  ${p.doi?`<div class="doi">DOI: <a href="https://doi.org/${esc(p.doi)}" target="_blank" rel="noopener">${esc(p.doi)}</a></div>`:''}</div></div>`;
}
function draw(d){
  const ps=d.pubs; let n=ps.length;
  document.getElementById('total').innerHTML=`<b>${ps.length}</b> Journal publications`;
  document.getElementById('upd').textContent=`Updated on ${d.updated}`;
  const years=[...new Set(ps.filter(p=>p.y>=SPLIT).map(p=>p.y))].sort((a,b)=>b-a);
  const old=ps.filter(p=>p.y<SPLIT);
  document.getElementById('nav').innerHTML=years.map(y=>`<a href="#y${y}">${y}</a>`).join('')+(old.length?`<a href="#before">Before ${SPLIT}</a>`:'');
  let h='';
  for(const y of years){
    const g=ps.filter(p=>p.y===y);
    h+=`<h2 id="y${y}"><b>${String(y).slice(0,1)}</b>${String(y).slice(1)}<small>${g.length} papers</small></h2><div class="rule"></div>`;
    h+=g.map(p=>item(p,n--,true)).join('');
  }
  if(old.length){
    h+=`<h2 id="before"><b>B</b>efore ${SPLIT}<small>${old.length} papers</small></h2><div class="rule"></div><div class="old">`;
    h+=old.map(p=>item(p,n--,false)).join('')+'</div>';
  }
  document.getElementById('list').innerHTML=h;
}
// 연도 버튼: 상자 밖(사이트 페이지)까지 그 연도로 스크롤
// 그림이 늦게 불려 오면 위치가 밀리므로, 그림을 먼저 모두 불러온 뒤 이동한다
document.getElementById('nav').onclick=async e=>{const a=e.target.closest('a');if(!a)return;e.preventDefault();
  const im=[...document.images];im.forEach(i=>i.loading='eager');
  await Promise.all(im.map(i=>i.complete?0:new Promise(r=>{i.onload=i.onerror=r})));
  // 제목 바로 위에 표지(probe)를 두고 그쪽으로 이동한다. 브라우저가 zoom을 반영하므로 위치는 zoom 전 값(y)을 쓰고,
  // 여백만 실제 화면 px로 맞춘다(휴대폰은 사이트 상단 막대 높이만큼 70px, PC는 24px)
  const el=document.querySelector(a.getAttribute('href')),z=parseFloat(document.documentElement.style.zoom)||1;
  let y=0;for(let n=el;n;n=n.offsetParent)y+=n.offsetTop;
  const p=document.createElement('div');p.style.cssText=`position:absolute;left:0;top:${y-(innerWidth<700?70:24)/z}px;height:1px;width:1px`;
  document.body.appendChild(p);p.scrollIntoView({block:'start'});p.remove();
}
(window.DEMO?Promise.resolve(window.DEMO):fetch(API).then(r=>r.json())).then(draw)
 .catch(()=>{document.getElementById('list').innerHTML='<div class="ld">Could not load. Please refresh the page.</div>';});
</script>
</body>
</html>
