<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NIE LAB Alumni map</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;700&family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
/* Alumni 페이지 안의 상자: 지도 라이브러리가 확대(zoom)된 문서에서 좌표를 잘못 잡으므로 이 페이지는 zoom 없이 폭에 맞춰 그린다 */
*{box-sizing:border-box;margin:0;padding:0}
html,body{overflow:hidden;background:#fff;font-family:"Open Sans",Arial,sans-serif;color:#212121}
.hd{display:flex;justify-content:space-between;align-items:baseline;margin:0 8px 14px}
.hd h2{font-family:Oswald,sans-serif;font-weight:400;font-size:30px;text-transform:uppercase;letter-spacing:.5px}
.hd span{font-family:Oswald,sans-serif;font-size:17px;color:#757575}
#map{height:56vw;max-height:420px;margin:0 8px;border:1px solid #e6e6e6;border-radius:6px}
.lab{background:#fff;border:1px solid #d6dbff;border-radius:12px;padding:2px 8px;font-size:12px;font-weight:600;color:#0000ff;box-shadow:none}
.lab:before{display:none}
.st{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin:18px 8px 0}
.s{border:1px solid #e6e6e6;border-radius:6px;padding:14px 16px;display:flex;gap:12px}
.s img{width:56px;height:56px;border-radius:50%;object-fit:cover;flex:none}
.s b{display:block;font-size:14px}.s small{display:block;font-size:12px;color:#757575;margin-bottom:6px}
.s p{font-size:13px;line-height:1.5;font-style:italic;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.inv{margin:18px 8px 0;border:1px dashed #b8c0ff;background:#f7f8ff;border-radius:6px;padding:16px 20px;font-size:15px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.inv a{flex:none;background:#0000ff;color:#fff;text-decoration:none;font-family:Oswald,sans-serif;font-size:16px;padding:8px 18px;border-radius:4px}
@media(max-width:700px){.hd h2{font-size:20px}.hd span{font-size:13px}#map{height:62vw}.st{grid-template-columns:1fr;gap:8px;margin-top:10px}.s:nth-child(n+2){display:none}.inv{font-size:12.5px;padding:10px 12px;margin-top:10px}.inv a{font-size:14px;padding:6px 12px}}
</style>
</head>
<body>
<div class="hd"><h2>Where our alumni are</h2><span id="cnt"></span></div>
<div id="map"></div>
<div id="st"></div>
<script>
// 웹앱 ?type=spot: pins = Alumni의 현재 소속(시트 Places 탭 좌표), stories = 승인된 졸업생 근황(설문 → 승인 탭 Y)
const API='https://script.google.com/macros/s/AKfycbwQ1zLyqlhWx-5i-VVdNoP1oInUUhwnRqPiLEOHH3Gw50bw8Gat0yg9bvZ90tz4OpHWyw/exec?type=spot';
const FORM='https://forms.gle/UcNwSxips5Y9wQDTA';
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const map=L.map('map',{scrollWheelZoom:false,attributionControl:true}).setView([36.2,127.9],7);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:12,attribution:'© OpenStreetMap'}).addTo(map);
fetch(API).then(r=>r.json()).then(d=>{
  const pts=[];
  // 같은 도시(약 20 km 안)의 소속은 핀 하나로 합친다: "KAIST · KRICT (Daejeon)"
  const G=[];d.pins.forEach(p=>{const g=G.find(g=>Math.hypot(g.lat-p.lat,g.lng-p.lng)<.2);const m=String(p.place).match(/^(.*?)\s*\(([^)]*)\)$/)||[0,p.place,''];
    if(g){g.orgs.push(m[1]);g.names=g.names.concat(p.names)}else G.push({lat:p.lat,lng:p.lng,orgs:[m[1]],city:m[2],names:p.names.slice()})});
  G.forEach(g=>g.place=g.orgs.join(' · ')+(g.city?` (${g.city})`:''));
  G.forEach(p=>{const m=L.circleMarker([p.lat,p.lng],{radius:7+3*p.names.length,color:'#0000ff',weight:2,fillColor:'#0000ff',fillOpacity:.25}).addTo(map);
    m.bindTooltip(`${esc(p.place)} · ${p.names.length}`,{permanent:true,direction:p.lng<127.2?'left':'right',className:'lab',offset:[p.lng<127.2?-8:8,0]});
    m.bindPopup(`<b>${esc(p.place)}</b><br>${p.names.map(esc).join('<br>')}`);pts.push([p.lat,p.lng])});
  d.stories.filter(s=>s.lat).forEach(s=>{L.circleMarker([s.lat,s.lng],{radius:6,color:'#ff5252',fillColor:'#ff5252',fillOpacity:.8}).addTo(map).bindPopup(`<b>${esc(s.en)}</b><br>${esc(s.pos)}`);pts.push([s.lat,s.lng])});
  if(pts.length>1)map.fitBounds(pts,{padding:[50,50],maxZoom:8});
  const n=G.reduce((a,p)=>a+p.names.length,0);
  document.getElementById('cnt').textContent=n+' alumni in industry & academia';
  const st=d.stories.slice(-3).reverse();
  document.getElementById('st').innerHTML=(st.length?'<div class="st">'+st.map(s=>`<div class="s">${s.photo?`<img src="${s.photo}" alt="">`:''}<div><b>${esc(s.en)}</b><small>${esc(s.pos)}</small><p>“${esc(s.memory||s.now)}”</p></div></div>`).join('')+'</div>':'')+
    `<div class="inv"><span>Are you an NIE LAB alumnus? Tell us where you are now and share a memory.</span><a href="${FORM}" target="_blank" rel="noopener">Share your story</a></div>`;
}).catch(()=>{});
</script>
<script src="ko.js"></script>
</body>
</html>
