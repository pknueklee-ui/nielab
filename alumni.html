<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NIE LAB Alumni</title></head><body>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400&family=Open+Sans:wght@400;700&family=Dancing+Script:wght@500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html{scrollbar-width:none}
</style>
<script>
// Sites 삽입 상자는 폭에 비례해 높이가 바뀐다 → 안쪽도 1068px 기준으로 같은 비율로 확대·축소해 스크롤이 하나만 생기게 한다
if(window!==top){
  // 사이트 삽입 상자는 폭에 비례해 높이가 바뀌고, 처음엔 좁게 떴다가 넓어지기도 한다 → 폭이 바뀔 때마다 다시 맞춘다
  // 넓은 화면(≥700): 1068px 기준으로 확대·축소하고 휴대폰용 @media 규칙을 끈다 / 휴대폰: 원래 크기 + 휴대폰 배치(.compact)
  const R=[];let mode=null;
  const ap=()=>{const w=innerWidth>=700,d=document.documentElement;
    d.style.zoom=w?innerWidth/1068:1;d.classList.toggle('compact',!w);
    if(w===mode)return;mode=w;
    if(w)[...document.styleSheets].forEach(s=>{try{for(let i=s.cssRules.length-1;i>=0;i--)if(s.cssRules[i] instanceof CSSMediaRule){R.push([s,s.cssRules[i].cssText]);s.deleteRule(i)}}catch(e){}});
    else R.splice(0).forEach(([s,t])=>{try{s.insertRule(t,s.cssRules.length)}catch(e){}});};
  ap();addEventListener("resize",ap);addEventListener("DOMContentLoaded",()=>{mode=null;ap()});
}
</script>
<style>html::-webkit-scrollbar{display:none}
.pt{text-align:center;margin:6px 0 30px}.pt h1{font-family:Oswald,sans-serif;font-weight:400;font-size:58px;line-height:1.15;color:#212121;display:inline-block;padding:0 48px 4px;border-bottom:8px solid #ff5252}
@media(max-width:700px){.pt h1{font-size:38px;padding:0 20px 2px;border-bottom-width:6px}}
.ld{display:flex;align-items:center;justify-content:center;gap:14px;padding:70px 0;font-family:Oswald,sans-serif;font-size:24px;letter-spacing:1px;color:#616161}
.sp{width:28px;height:28px;border:3px solid #e0e0e0;border-top-color:#0000ff;border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
body{background:#fff;font-family:"Open Sans",Arial,sans-serif;color:#212121}
.wrap{max-width:1160px;margin:0 auto;padding:4px 8px 24px}
.almap{display:block;width:100%;border:0;height:700px;margin:0 0 50px}
.compact .almap{height:440px}
.upd{text-align:right;font-family:Georgia,serif;font-style:italic;font-weight:700;font-size:17px;margin:8px 0 40px}
h2{font-size:42px;font-weight:700;margin:56px 0 44px 8px}
h2:first-of-type{margin-top:0}
.m{display:flex;gap:38px;margin-bottom:52px;align-items:flex-start}
.m img,.m .ph{width:168px;height:168px;border-radius:50%;object-fit:cover;object-position:50% 45%;flex:none;background:#eee;box-shadow:0 0 0 1px #e0e0e0}
.ty{font-family:"Dancing Script",cursive;font-size:21px;color:#444;margin-top:4px}
.m h3{font-size:24px;font-weight:700;margin:12px 0 18px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px 48px}
.two .m{gap:24px}
.two .m img,.two .m .ph{width:160px;height:160px}
.two .m dl div{text-align:left}
.two .m h3{font-size:20px;margin:8px 0 12px}
.m dl{font-size:13px;line-height:1.6}
.m dt{font-weight:700;display:inline}
.m dd{display:inline;margin:0}
.m dl div{margin-bottom:8px;text-align:justify}
.pc{display:flex;flex-direction:column;align-items:center;gap:14px;flex:none}
.mb{font-family:Oswald,sans-serif;font-size:15px;letter-spacing:.5px;color:#0000ff;background:#fff;border:1.5px solid #0000ff;border-radius:3px;padding:5px 16px;cursor:pointer}
.pc .lk{margin-top:-6px}
.mb:hover{background:#0000ff;color:#fff}
#memo{position:absolute;z-index:30;left:50%;transform:translateX(-50%);width:min(860px,96%);background:#fff;border-radius:6px;box-shadow:0 10px 40px rgba(0,0,0,.28);display:none}
#memo.on{display:block}
#memo .hd{display:flex;align-items:center;gap:18px;padding:18px 24px 12px;border-bottom:1px solid #e0e0e0}
#memo .hd h4{font-size:20px;flex:1}
#memo .kn{font-size:15px;font-weight:400;color:#7a7a7a;margin-left:6px}
#memo .x{border:0;background:none;font-size:26px;line-height:1;cursor:pointer;color:#616161;margin-left:8px}
#memo .bd{max-height:640px;overflow-y:auto;padding:20px 28px 26px;font-size:14px;line-height:1.75}
#memo .bd p{margin:0 0 6px;white-space:pre-line}
#memo .bd p.kr{margin:0 0 20px;font-size:12.5px;line-height:1.7;color:#8a8a8a}
#memo .bd .sg{margin-top:24px;padding-top:14px;border-top:1px dashed #bdbdbd}
#memo .bd .sg p:first-child{font-style:italic;color:#555}
#memo .bd .ko-t{font-size:inherit;color:inherit}
@media(max-width:800px){.two{grid-template-columns:1fr}}
@media(max-width:640px){.m dl div{text-align:left}.m{flex-direction:column;gap:12px}h2{font-size:30px}}
</style>
<div class="wrap" id="root"><div class="pt"><h1>ALUMNI</h1></div><div class="ld" id="ld"><span class="sp"></span>Loading…</div></div>
<script src="memoirs.js"></script>
<script src="like.js"></script>
<script>
// Member/Alumni: Apps Script 웹앱(시트 Homepage 탭, 매시간 갱신)이 내주는 JSON을 그린다
const API='https://script.google.com/macros/s/AKfycbwQ1zLyqlhWx-5i-VVdNoP1oInUUhwnRqPiLEOHH3Gw50bw8Gat0yg9bvZ90tz4OpHWyw/exec';
const GROUPS=['Alumni'];
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
// 신청서 원본 증명사진(pa)은 세로로 길고 얼굴이 위쪽에 있다 → 폭의 78% 정사각형을 위에서 4.7% 지점부터 잘라 원 안에 얼굴이 가운데 오게 한다
const fitFace=img=>{const go=()=>{const w=img.naturalWidth,h=img.naturalHeight;if(!w||h/w<1.1)return;const s=Math.round(w*.78),c=document.createElement('canvas');c.width=c.height=s;
  c.getContext('2d').drawImage(img,(w-s)/2,h*.047,s,s,0,0,s,s);img.removeAttribute('data-auto');img.src=c.toDataURL('image/jpeg',.9)};img.complete?go():img.addEventListener('load',go,{once:true})};
new MutationObserver(()=>document.querySelectorAll('img[data-auto]').forEach(fitFace)).observe(document.body,{childList:true,subtree:true});
const row=(k,v)=>v?`<div><dt>${k}:</dt> <dd>${esc(v)}</dd></div>`:'';
function draw(d){
  let h=`<div class="pt"><h1>ALUMNI</h1></div><div class="upd">Updated on ${esc(d.updated)}</div><iframe class="almap" src="almap.html" title="Where our alumni are"></iframe>`;
  for(const g of GROUPS){
    const ms=d.members.filter(m=>m.group===g);
    if(!ms.length) continue;
    if(GROUPS.length>1) h+=`<h2>${esc(g==='Students'?'Research Students':g)}</h2>`;
    h+=`<div class="${g==='Alumni'?'two':''}">`;
    for(const m of ms){
      const period=g==='Alumni'?(m.start?`${m.start} – ${m.end}`:''):(m.start?`${m.start} ~`:'');
      const ph=m.photo?`<img src="${m.photo}" alt="${esc(m.en)}" loading="lazy"${m.pa?' data-auto':''}>`:'<div class="ph"></div>';
      const mo=window.MEMOIRS&&MEMOIRS[m.name];
      h+=`<div class="m">${mo?`<div class="pc">${ph}<button class="mb" data-k="${esc(m.name)}" data-en="${esc(m.en)}">Read memoir</button>${NIELIKE.html('m:'+m.name)}</div>`:ph}<div>
        <h3>${esc(m.name)}, ${esc(m.en)}</h3><dl>
        ${row('Hobby',m.hobby)}${m.good||m.mbti?`<div><dt>${m.good?'Specialty':'MBTI'}:</dt> <dd>${esc(m.good||m.mbti)}${m.good&&m.mbti?' &nbsp;·&nbsp; <b>MBTI</b> '+esc(m.mbti):''}</dd></div>`:''}${row('Research interest',m.research)}${row('Goal at NIE LAB',m.goal)}
        ${row(g==='Alumni'?'Period':'Starting from',period)}${row('Current affiliation',m.affil)}
        </dl>${g==='Alumni'?'<div class="ty">Thank you for your contribution</div>':''}</div></div>`;
    }
    h+='</div>';
  }
  document.getElementById('root').innerHTML=h;
}
// 회고록 창: 사이트 삽입 상자 안이라 화면 고정이 안 되므로, 누른 카드 위치에 문서 좌표로 띄운다. 영어 문단 밑에 같은 문단 한글 원문(작고 회색).
(()=>{const box=document.createElement('div');box.id='memo';box.setAttribute('role','dialog');document.body.appendChild(box);
  const show=(k,en)=>{const mo=MEMOIRS[k];
    let ps=mo.en.map((t,i)=>`<p>${esc(t)}</p><p class="kr">${esc(mo.ko[i]||'')}</p>`).join('');
    if(mo.song)ps+=`<div class="sg"><p>${esc(mo.song.en)}</p><p class="kr">${esc(mo.song.ko)}</p></div>`;
    box.innerHTML=`<div class="hd"><h4>Memoir — ${esc(en)} <span class="kn">${esc(k)}</span></h4>${NIELIKE.html('m:'+k)}
      <button class="x" aria-label="Close">×</button></div><div class="bd">${ps}</div>`;};
  const close=()=>box.classList.remove('on');
  document.addEventListener('click',e=>{
    const b=e.target.closest('.mb');
    if(b){show(b.dataset.k,b.dataset.en);const z=parseFloat(document.documentElement.style.zoom)||1;
      const w=document.querySelector('.wrap'),H=w.offsetTop+w.offsetHeight;box.classList.add('on');  // 마지막 줄 카드에서도 상자 밖으로 잘리지 않게
      box.style.top=Math.max(0,Math.min(b.closest('.m').getBoundingClientRect().top/z+scrollY-10,H-box.offsetHeight-10))+'px';
      box.querySelector('.bd').scrollTop=0;box.scrollIntoView({block:'nearest'});return}
    if(e.target.closest('#memo .x')||(box.classList.contains('on')&&!e.target.closest('#memo')))close();});
  addEventListener('keydown',e=>{if(e.key==='Escape')close()});
})();
(window.DEMO?Promise.resolve(window.DEMO):fetch(API).then(r=>r.json())).then(draw)
 .catch(()=>{document.getElementById('ld').outerHTML='<div class="ld">Could not load. Please refresh the page.</div>';});
</script>
<style>
#totop{position:absolute;right:18px;width:46px;height:46px;border-radius:50%;border:0;background:rgba(33,33,33,.85);color:#fff;font-size:22px;line-height:46px;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.25);opacity:0;pointer-events:none;transition:opacity .2s,top .15s;z-index:20}
#totop.on{opacity:1;pointer-events:auto}#totop.fx{position:fixed;bottom:20px}
.stp{position:absolute;left:0;width:1px;height:120px;pointer-events:none}
</style>
<script>
// 맨 위로 버튼: 사이트 삽입 상자 안이라 화면 고정(fixed)이 안 된다. 120px 간격 표지(.stp)를 IntersectionObserver로 지켜
// 지금 화면에 보이는 범위의 아래쪽에 버튼을 옮겨 둔다(값은 상자 화면 px → zoom으로 나눠 문서 좌표로)
(()=>{const b=document.createElement('button');b.id='totop';b.setAttribute('aria-label','Back to top');b.textContent='↑';document.body.appendChild(b);
  const go=()=>{(document.querySelector('.wrap')||document.body).scrollIntoView({block:'start'});if(window===top)scrollTo({top:0,behavior:'smooth'})};b.onclick=go;
  if(window===top){b.classList.add('fx');addEventListener('scroll',()=>b.classList.toggle('on',scrollY>600));return}
  const vis=new Map();let st=[];
  const io=new IntersectionObserver(es=>{es.forEach(e=>e.isIntersecting?vis.set(e.target,e.intersectionRect):vis.delete(e.target));
    if(!vis.size)return;let bot=0,tp=1e9;vis.forEach(r=>{bot=Math.max(bot,r.bottom);tp=Math.min(tp,r.top)});
    const z=parseFloat(document.documentElement.style.zoom)||1;window.__tt=[bot,tp,z,scrollY,vis.size];b.style.top=(bot/z+scrollY-70)+'px';b.classList.toggle('on',tp/z+scrollY>500)},{threshold:[0,.25,.5,.75,1]});
  const mk=()=>{st.forEach(s=>{io.unobserve(s);s.remove()});st=[];vis.clear();const w=document.querySelector('.wrap')||document.body,H=w.offsetTop+w.offsetHeight;
    for(let y=0;y<H;y+=120){const s=document.createElement('div');s.className='stp';s.style.top=y+'px';s.style.height=Math.min(120,H-y)+'px';document.body.appendChild(s);st.push(s);io.observe(s)}};
  let t;new ResizeObserver(()=>{clearTimeout(t);t=setTimeout(mk,400)}).observe(document.body);mk();
})();
</script>
<style>
#more{position:fixed;left:0;right:0;bottom:0;height:64px;padding-top:30px;text-align:center;font-family:Oswald,sans-serif;font-size:15px;letter-spacing:.5px;color:#0000ff;background:linear-gradient(rgba(255,255,255,0),#fff 55%);pointer-events:none;opacity:0;transition:opacity .2s;z-index:19}
#more.on{opacity:1}
</style>
<script>
// 휴대폰: 사이트 상자가 내용보다 짧아 상자 안을 밀어 내려야 한다 → 끝에 닿기 전까지 아래에 안내를 띄운다
(()=>{if(window===top)return;const m=document.createElement('div');m.id='more';m.textContent='Scroll for more ↓';document.body.appendChild(m);
  const f=()=>{const d=document.documentElement;m.classList.toggle('on',d.classList.contains('compact')&&scrollY+innerHeight<d.scrollHeight-40)};
  addEventListener('scroll',f,{passive:true});addEventListener('resize',f);new ResizeObserver(f).observe(document.body);f();
})();
</script>
<script>
// 졸업생 지도 상자(같은 사이트의 almap.html)는 근황 카드 수에 따라 높이가 바뀌므로 안쪽 높이에 맞춘다
setInterval(()=>{const f=document.querySelector('.almap');try{const h=f&&f.contentDocument.body.offsetHeight+8;if(h)f.style.height=h+'px'}catch(e){}},800);
</script>
<script src="ko.js"></script>
