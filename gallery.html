<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NIE LAB Gallery</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;700&family=Caveat:wght@700&family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html{scrollbar-width:none}
</style>
<script>
// Sites 삽입 상자는 폭에 비례해 높이가 바뀐다 → 넓은 화면은 1068px 기준으로 같은 비율로 확대·축소, 휴대폰은 원래 크기의 휴대폰 배치
if(window!==top){
  // 사이트 삽입 상자는 폭에 비례해 높이가 바뀌고, 처음엔 좁게 떴다가 넓어지기도 한다 → 폭이 바뀔 때마다 다시 맞춘다
  // 넓은 화면(≥700): 1068px 기준으로 확대·축소하고 휴대폰용 @media 규칙을 끈다 / 휴대폰: 원래 크기 + 휴대폰 배치(.compact)
  const R=[];let mode=null;
  const ap=()=>{const w=innerWidth>=700,d=document.documentElement;
    d.style.zoom=w?innerWidth/1068:1;d.classList.toggle('compact',!w);
    if(w===mode)return;mode=w;
    if(w)[...document.styleSheets].forEach(s=>{try{for(let i=s.cssRules.length-1;i>=0;i--)if(s.cssRules[i] instanceof CSSMediaRule){R.push([s,s.cssRules[i].cssText]);s.deleteRule(i)}}catch(e){}});
    else R.splice(0).forEach(([s,t])=>{try{s.insertRule(t,s.cssRules.length)}catch(e){}});};
  ap();addEventListener("resize",ap);addEventListener("DOMContentLoaded",()=>{mode=null;ap()});
}
</script>
<style>html::-webkit-scrollbar{display:none}
body{background:#fff;font-family:"Open Sans",Arial,sans-serif;color:#212121}
.wrap{max-width:1160px;margin:0 auto;padding:4px 8px 32px}
.pt{text-align:center;margin:6px 0 22px}.pt h1{font-family:Oswald,sans-serif;font-weight:400;font-size:58px;line-height:1.15;display:inline-block;padding:0 48px 4px;border-bottom:8px solid #ff5252}
.yrs{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-bottom:6px}
.yrs button{font-family:Oswald,sans-serif;font-size:19px;background:#fff;border:1px solid #d6dbff;color:#0000ff;border-radius:20px;padding:5px 18px;cursor:pointer;text-align:center;line-height:1.2}
.yrs button small{display:block;font-family:"Open Sans",Arial,sans-serif;font-size:11px;color:#757575}
.yrs button.on{background:#0000ff;color:#fff;border-color:#0000ff}.yrs button.on small{color:#dfe3ff}
.mem{font-family:Caveat,cursive;font-size:56px;line-height:1.3;margin:10px 0 8px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px 20px}
.ev{display:block;width:100%;cursor:pointer;background:none;border:0;text-align:left;font:inherit;color:inherit}
.ev .cv{display:block;position:relative;aspect-ratio:4/3;overflow:hidden;border-radius:6px;background:#f2f2f2}
.ev img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .3s}
.ev:hover img{transform:scale(1.04)}
.ev .n{position:absolute;right:8px;bottom:8px;background:rgba(0,0,0,.6);color:#fff;font-size:12.5px;border-radius:12px;padding:2px 9px}
.ev .t{display:block;color:#f34f4c;font-size:19px;line-height:1.3;margin-top:9px}
.ev .d{display:block;font-size:14px;color:#757575;margin-top:2px}
.pg{text-align:center;margin-top:26px}
.pg button{font-family:Oswald,sans-serif;font-size:17px;border:1px solid #ddd;background:#fff;border-radius:4px;width:38px;height:36px;margin:0 3px;cursor:pointer}
.pg button.on{background:#212121;color:#fff;border-color:#212121}
.msg{text-align:center;color:#757575;font-size:16px;padding:60px 0}
#lb{position:fixed;left:0;right:0;top:0;bottom:0;background:rgba(0,0,0,.92);z-index:30;display:none;flex-direction:column;align-items:center;justify-content:center;color:#fff}
#lb.on{display:flex}
#lb img{max-width:92%;max-height:calc(100% - 110px);object-fit:contain;border-radius:3px}
#lb .cap{margin-top:12px;font-size:15px;text-align:center;padding:0 60px}
#lb .cap a{color:#9fb0ff;font-size:13px;margin-left:10px}
#lb button{position:absolute;background:rgba(255,255,255,.12);border:0;color:#fff;font-size:30px;width:52px;height:52px;border-radius:50%;cursor:pointer}
#lb .x{top:14px;right:14px;font-size:26px}#lb .pv{left:14px;top:calc(50% - 26px)}#lb .nx{right:14px;top:calc(50% - 26px)}
.compact .pt h1{font-size:32px;padding:0 24px 2px;border-bottom-width:6px}.compact .pt{margin-bottom:14px}
.compact .grid{grid-template-columns:1fr 1fr;gap:14px 10px}.compact .ev .t{font-size:15px}.compact .ev .d{font-size:12px}
.compact .mem{font-size:36px}.compact .yrs button{font-size:16px;padding:4px 12px}
@media(max-width:700px){.grid{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div class="wrap">
  <div class="pt"><h1>GALLERY</h1></div>
  <div class="yrs" id="yrs"></div>
  <div id="out"><p class="msg">Loading…</p></div>
</div>
<div id="lb"><button class="x" aria-label="Close">✕</button><button class="pv" aria-label="Previous">‹</button><button class="nx" aria-label="Next">›</button><img alt=""><p class="cap"></p></div>
<script>
// 행사·사진은 Apps Script 웹앱(?type=gallery)이 「Gallery albums」 탭의 구글 포토 공유 앨범을 매일 읽어 날짜별로 묶어 준다.
// 이름·공개 여부는 「NIE LAB Publications」 시트의 Gallery 탭에서 고친다.
const API='https://script.google.com/macros/s/AKfycbwQ1zLyqlhWx-5i-VVdNoP1oInUUhwnRqPiLEOHH3Gw50bw8Gat0yg9bvZ90tz4OpHWyw/exec';
// 앨범 없이 옛 갤러리에 올라 있던 사진(날짜 미상 → 연도만)
const G='images/site/gallery/i';
const OLD=[
  ['2025','Graduation',[1]],
  ['2024','Lab photo',[2,3]],['2024','Conference',[5,6]],['2024','Cherry blossom outing',[7]],['2024','Bowling night',[8,13]],
  ['2024','Lab dinner',[12,14]],['2024','Lab seminar',[4,9,11,15,16,17]],['2024','Experimenting',[10]],
  ['2023.05.22','Lab startup program orientation',[27]],['2023','Industry–Academia Cooperation EXPO award',[19]],['2023','Lab workshop',[22,23,24]],['2023','Lab dinner',[18,21]],['2023','Lab seminar',[20,25]]
].map(([d,n,ids])=>({d,n,ph:ids.map(i=>[G+String(i).padStart(2,'0')+'.jpg'])}));
const PER=12,esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const sz=(u,s)=>/googleusercontent/.test(u)?u+'='+s:u;
let EV=[],year,page=0;
function show(){
  const list=EV.filter(e=>e.d.slice(0,4)===year),pages=Math.ceil(list.length/PER);
  document.querySelectorAll('#yrs button').forEach(b=>b.classList.toggle('on',b.dataset.y===year));
  document.getElementById('out').innerHTML='<p class="mem">Memories in '+year+'</p><div class="grid">'+
    list.slice(page*PER,page*PER+PER).map(e=>`<button class="ev" data-i="${EV.indexOf(e)}"><span class="cv"><img src="${esc(sz(e.ph[0][0],'w640-h480-c'))}" alt="" loading="lazy"><span class="n">${e.ph.length} photo${e.ph.length>1?'s':''}</span></span><span class="t">${esc(e.n||e.d)}</span><span class="d">${e.d.length>4?esc(e.d):''}</span></button>`).join('')+'</div>'+
    (pages>1?'<div class="pg">'+Array.from({length:pages},(_,i)=>`<button data-p="${i}" class="${i===page?'on':''}">${i+1}</button>`).join('')+'</div>':'');
}
document.getElementById('yrs').onclick=e=>{const b=e.target.closest('button');if(b){year=b.dataset.y;page=0;show()}};
document.getElementById('out').onclick=e=>{const p=e.target.closest('.pg button'),v=e.target.closest('.ev');
  if(p){page=+p.dataset.p;show();document.querySelector('.wrap').scrollIntoView({block:'start'})}
  if(v)open(EV[+v.dataset.i],0)};
// 사진 크게 보기: 사이트 삽입 상자 안에서는 화면 고정(fixed)이 안 되므로 지금 보이는 범위(window.__vr)에 맞춰 놓는다
const lb=document.getElementById('lb');let cur,ci;
function open(e,i){cur=e;ci=(i+e.ph.length)%e.ph.length;
  lb.querySelector('img').src=sz(e.ph[ci][0],'w1600');
  lb.querySelector('.cap').innerHTML=esc(e.n||e.d)+(e.d.length>4?' · '+esc(e.d):'')+' &nbsp;('+(ci+1)+' / '+e.ph.length+')'+(e.link?`<a href="${esc(e.link)}" target="_blank" rel="noopener">Album ↗</a>`:'');
  lb.querySelector('.pv').style.display=lb.querySelector('.nx').style.display=e.ph.length>1?'':'none';
  if(window!==top&&window.__vr){lb.style.position='absolute';lb.style.top=window.__vr[0]+'px';lb.style.bottom='auto';lb.style.height=(window.__vr[1]-window.__vr[0])+'px'}
  lb.classList.add('on')}
lb.onclick=e=>{if(e.target.matches('.pv'))open(cur,ci-1);else if(e.target.matches('.nx'))open(cur,ci+1);else if(!e.target.closest('a'))lb.classList.remove('on')};
lb.querySelector('img').onclick=e=>{e.stopPropagation();if(cur.ph.length>1)open(cur,ci+1)};
addEventListener('keydown',e=>{if(!lb.classList.contains('on'))return;if(e.key==='Escape')lb.classList.remove('on');if(e.key==='ArrowLeft')open(cur,ci-1);if(e.key==='ArrowRight')open(cur,ci+1)});
fetch(API+'?type=gallery').then(r=>r.json()).then(d=>d.events).catch(()=>[]).then(ev=>{
  EV=ev.concat(OLD).sort((a,b)=>b.d.slice(0,4)-a.d.slice(0,4));
  const ys=[...new Set(EV.map(e=>e.d.slice(0,4)))];
  document.getElementById('yrs').innerHTML=ys.map(y=>`<button data-y="${y}">${y}<small>${(n=>n+' event'+(n>1?'s':''))(EV.filter(e=>e.d.slice(0,4)===y).length)}</small></button>`).join('');
  year=ys[0];show();
});
</script>
<style>
#totop{position:absolute;right:18px;width:46px;height:46px;border-radius:50%;border:0;background:rgba(33,33,33,.85);color:#fff;font-size:22px;line-height:46px;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.25);opacity:0;pointer-events:none;transition:opacity .2s,top .15s;z-index:20}
#totop.on{opacity:1;pointer-events:auto}#totop.fx{position:fixed;bottom:20px}
.stp{position:absolute;left:0;width:1px;height:120px;pointer-events:none}
</style>
<script>
// 맨 위로 버튼: 사이트 삽입 상자 안이라 화면 고정(fixed)이 안 된다. 120px 간격 표지(.stp)를 IntersectionObserver로 지켜
// 지금 화면에 보이는 범위의 아래쪽에 버튼을 옮겨 둔다(값은 상자 화면 px → zoom으로 나눠 문서 좌표로)
(()=>{const b=document.createElement('button');b.id='totop';b.setAttribute('aria-label','Back to top');b.textContent='↑';document.body.appendChild(b);
  const go=()=>{(document.querySelector('.wrap')||document.body).scrollIntoView({block:'start'});if(window===top)scrollTo({top:0,behavior:'smooth'})};b.onclick=go;
  if(window===top){b.classList.add('fx');addEventListener('scroll',()=>b.classList.toggle('on',scrollY>600));return}
  const vis=new Map();let st=[];
  const io=new IntersectionObserver(es=>{es.forEach(e=>e.isIntersecting?vis.set(e.target,e.intersectionRect):vis.delete(e.target));
    if(!vis.size)return;let bot=0,tp=1e9;vis.forEach(r=>{bot=Math.max(bot,r.bottom);tp=Math.min(tp,r.top)});
    const z=parseFloat(document.documentElement.style.zoom)||1;window.__tt=[bot,tp,z,scrollY,vis.size];window.__vr=[tp/z+scrollY,bot/z+scrollY];b.style.top=(bot/z+scrollY-70)+'px';b.classList.toggle('on',tp/z+scrollY>500)},{threshold:[0,.25,.5,.75,1]});
  const mk=()=>{st.forEach(s=>{io.unobserve(s);s.remove()});st=[];vis.clear();const w=document.querySelector('.wrap')||document.body,H=w.offsetTop+w.offsetHeight;
    for(let y=0;y<H;y+=120){const s=document.createElement('div');s.className='stp';s.style.top=y+'px';s.style.height=Math.min(120,H-y)+'px';document.body.appendChild(s);st.push(s);io.observe(s)}};
  let t;new ResizeObserver(()=>{clearTimeout(t);t=setTimeout(mk,400)}).observe(document.body);mk();
})();
</script>
</body>
</html>
